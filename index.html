<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسامة عكور</title>
<meta name="description" content="الموقع الشخصي لأسامة عكور">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#fafaf7; --fg:#1b1b1b; --muted:#666; --accent:#2f6fed; --card:#fff; --line:#e6e6e0; }
@media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#ececec; --muted:#9a9a9a; --accent:#6b9bff; --card:#1a1b1e; --line:#2a2b2f; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"IBM Plex Sans Arabic", system-ui, sans-serif; line-height:1.7; }
main { max-width:680px; margin:0 auto; padding:72px 20px; }
.avatar { width:96px; height:96px; border-radius:50%; border:1px solid var(--line); }
h1 { font-size:2.2rem; margin:20px 0 4px; }
.lead { color:var(--muted); font-size:1.1rem; margin:0 0 32px; }
h2 { font-size:1.1rem; margin:40px 0 12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
footer { margin-top:56px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
<img class="avatar" src="https://github.com/OsamaAkour.png" alt="صورة أسامة">
<h1>أسامة عكور</h1>
<p class="lead">أهلاً بك في موقعي الشخصي. هنا أشارك مشاريعي وأخباري.</p>
<h2>عنّي</h2>
<div class="card"><p style="margin:0">اكتب هنا نبذة قصيرة عنك: ماذا تعمل، وما الذي يهمّك، وما تبنيه حالياً.</p></div>
<h2>روابط</h2>
<p><a href="https://github.com/OsamaAkour">GitHub</a></p>
<footer>© 2026 أسامة عكور</footer>
</main>
</body>
</html>
